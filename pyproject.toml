[project]
name = "sabibot"
version = "0.1.0"
description = "Autonomous Polymarket trading agent — timezone arbitrage, sentiment-driven execution"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "UNLICENSED" }

dependencies = [
    # Polymarket CLOB SDK
    "py-clob-client>=0.18.0",
    "py-order-utils>=0.3.0",

    # Web3
    "web3>=6.15.0",
    "eth-account>=0.11.0",

    # HTTP & WebSocket
    "httpx>=0.27.0",
    "websockets>=12.0",

    # AI / LLM
    "groq>=0.9.0",
    "anthropic>=0.34.0",
    "openai>=1.40.0",
    "tiktoken>=0.7.0",

    # NLP
    "spacy>=3.7.0",

    # Database
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Scheduling & Async
    "apscheduler>=3.10.4",

    # Telegram
    "python-telegram-bot>=21.0",

    # Config & Logging
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "rich>=13.9.0",

    # RSS / News
    "feedparser>=6.0.11",

    # Utilities
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
sabibot = "src.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
